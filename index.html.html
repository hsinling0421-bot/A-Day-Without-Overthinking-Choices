<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的一天｜分餐選擇器</title>
  <script src="https://tailwindcss.com"></script>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #ffd46728;
      background-image: radial-gradient(#e6b83a40 1px, transparent 1px);
      background-size: 20px 20px;
      color: #4a3b18;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border: 1.5px solid #ffd46788;
      box-shadow: 0 12px 30px -6px rgba(180, 130, 15, 0.1);
    }
    .brand-btn {
      background: linear-gradient(135deg, #ffd467 0%, #ffc436 100%);
      color: #3d2e08;
      box-shadow: 0 4px 14px rgba(255, 196, 54, 0.4);
    }
    .brand-btn:hover {
      background: linear-gradient(135deg, #ffca47 0%, #f5b622 100%);
      transform: translateY(-1px);
    }
    @keyframes popIn {
      0% { transform: scale(0.94); opacity: 0.5; }
      70% { transform: scale(1.03); }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.28s ease-out;
    }
  </style>
</head>
<body class="min-h-screen pb-16 relative overflow-x-hidden">

  <!-- 背景裝飾光暈 -->
  <div class="pointer-events-none fixed -top-24 -right-24 w-96 h-96 rounded-full bg-[#ffd46745] blur-3xl"></div>
  <div class="pointer-events-none fixed bottom-0 -left-24 w-80 h-80 rounded-full bg-[#ffd46735] blur-3xl"></div>

  <!-- 頂部導覽與分頁切換列 -->
  <header class="sticky top-0 z-30 border-b border-[#ffd46788] bg-[#fffdf7]/95 backdrop-blur-md">
    <div class="max-w-3xl mx-auto px-4 pt-3.5 pb-2.5">
      <div class="flex justify-between items-center mb-3">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-[#ffd467] flex items-center justify-center text-lg shadow-xs">🍽️</div>
          <div>
            <span class="text-[10px] font-bold tracking-widest uppercase text-[#a67c14] block leading-none">MY DAY FOOD PICKER</span>
            <h1 class="text-base sm:text-lg font-black text-[#3d2e08]">我的一天｜告別選擇障礙</h1>
          </div>
        </div>
        <button onclick="rollAllAndSummary()" class="brand-btn font-bold text-xs px-4 py-2 rounded-full transition active:scale-95 cursor-pointer">
          ✨ 一鍵決定整天
        </button>
      </div>

      <!-- 五個獨立頁面分頁按鈕 -->
      <nav id="tabNav" class="grid grid-cols-5 gap-1.5 bg-[#ffd46728] p-1.5 rounded-2xl border border-[#ffd46766]"></nav>
    </div>
  </header>

  <!-- 單頁主內容容器 -->
  <main id="pageContainer" class="max-w-3xl mx-auto px-4 pt-6 relative z-10"></main>

  <script>
    const MEAL_ORDER = ['breakfast', 'lunch', 'tea', 'dinner'];

    const DEFAULT_MEALS = {
      breakfast: {
        time: '08:30',
        emoji: '🌅',
        shortName: '早餐',
        title: '早餐選擇',
        subtitle: '用美味喚醒早晨，開啟一整天的好心情',
        selected: '總匯三明治 ＋ 無糖鮮奶茶',
        options: [
          '總匯三明治 ＋ 無糖鮮奶茶',
          '起司蛋餅 ＋ 冰美式咖啡',
          '鮪魚玉米吐司 ＋ 無糖豆漿',
          '日式飯糰 ＋ 熱拿鐵',
          '地瓜 ＋ 水煮蛋 ＋ 燕麥奶',
          '培根花生厚片 ＋ 紅茶'
        ]
      },
      lunch: {
        time: '12:00',
        emoji: '☀️',
        shortName: '午餐',
        title: '午餐選擇',
        subtitle: '中午吃飽飽，下午工作與生活才更有能量',
        selected: '舒肥雞胸健康餐盒',
        options: [
          '舒肥雞胸健康餐盒',
          '日式豚骨拉麵',
          '泰式打拋豬飯 ＋ 荷包蛋',
          '鮮蝦雲吞麵 ＋ 燙青菜',
          '韓式泡菜豆腐鍋',
          '義大利青醬雞肉麵'
        ]
      },
      tea: {
        time: '15:30',
        emoji: '🧋',
        shortName: '下午茶',
        title: '下午茶選擇',
        subtitle: '給忙碌的自己一點甜，專屬午後的療癒時光',
        selected: '熟成紅茶微糖少冰 ＋ 白玉珍珠',
        options: [
          '熟成紅茶微糖少冰 ＋ 白玉珍珠',
          '四季春青茶無糖去冰',
          '焦糖布丁 ＋ 熱紅茶',
          '巴斯克乳酪蛋糕 ＋ 美式咖啡',
          '現烤可頌 ＋ 冰拿鐵',
          '黑糖珍珠鮮奶（微冰）'
        ]
      },
      dinner: {
        time: '19:00',
        emoji: '🌙',
        shortName: '晚餐',
        title: '晚餐選擇',
        subtitle: '卸下一天的疲憊，好好享受溫暖的晚餐吧',
        selected: '昆布小火鍋（多蔬菜少火鍋料）',
        options: [
          '昆布小火鍋（多蔬菜少火鍋料）',
          '炙燒鮭魚丼飯 ＋ 味噌湯',
          '水餃 10 顆 ＋ 酸辣湯',
          '越式生春捲 ＋ 牛肉河粉',
          '滷味拼盤（高麗菜、金針菇、豆腐）',
          '藥燉排骨 ＋ 滷肉飯'
        ]
      }
    };

    let mealData = JSON.parse(localStorage.getItem('myday_food_tabs_v1')) || JSON.parse(JSON.stringify(DEFAULT_MEALS));
    let activeTab = 'breakfast'; // 'breakfast' | 'lunch' | 'tea' | 'dinner' | 'summary'

    function saveData() {
      localStorage.setItem('myday_food_tabs_v1', JSON.stringify(mealData));
    }

    function switchTab(tabKey) {
      activeTab = tabKey;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function pickRandom(key, animate = true) {
      const list = mealData[key].options;
      if (!list.length) return;

      const finishPick = () => {
        if (list.length === 1) {
          mealData[key].selected = list[0];
        } else {
          let next;
          do {
            next = list[Math.floor(Math.random() * list.length)];
          } while (next === mealData[key].selected);
          mealData[key].selected = next;
        }
        saveData();
        render(true);
      };

      if (!animate || list.length <= 1) {
        finishPick();
        return;
      }

      let count = 0;
      const timer = setInterval(() => {
        mealData[key].selected = list[count % list.length];
        render(false);
        count++;
        if (count >= 7) {
          clearInterval(timer);
          finishPick();
        }
      }, 45);
    }

    function rollAllAndSummary() {
      MEAL_ORDER.forEach(key => {
        const list = mealData[key].options;
        if (list.length) {
          mealData[key].selected = list[Math.floor(Math.random() * list.length)];
        }
      });
      saveData();
      activeTab = 'summary';
      render(true);
    }

    function selectManual(key, item) {
      mealData[key].selected = item;
      saveData();
      render(true);
    }

    function addOption(key) {
      const input = document.getElementById(`input_${key}`);
      const val = input.value.trim();
      if (!val) return;
      if (!mealData[key].options.includes(val)) {
        mealData[key].options.push(val);
      }
      mealData[key].selected = val;
      input.value = '';
      saveData();
      render(true);
    }

    function removeOption(key, index, event) {
      event.stopPropagation();
      const removed = mealData[key].options.splice(index, 1)[0];
      if (mealData[key].selected === removed) {
        mealData[key].selected = mealData[key].options[0] || '尚未選擇';
      }
      saveData();
      render(false);
    }

    function resetDefaults() {
      mealData = JSON.parse(JSON.stringify(DEFAULT_MEALS));
      saveData();
      render(true);
    }

    function copyMenu() {
      const todayStr = new Date().toLocaleDateString('zh-TW', { month: 'long', day: 'numeric', weekday: 'short' });
      const lines = [
        `📅 我的一天餐食清單（${todayStr}）`,
        ...MEAL_ORDER.map(k => {
          const m = mealData[k];
          return `${m.emoji} ${m.title}（${m.time}）：${m.selected}`;
        })
      ];
      navigator.clipboard.writeText(lines.join('\n')).then(() => {
        const btn = document.getElementById('copyBtn');
        if (btn) {
          btn.textContent = '✅ 已複製！';
          setTimeout(() => { btn.textContent = '📋 複製整天菜單'; }, 2000);
        }
      });
    }

    function renderTabs() {
      const tabs = [
        ...MEAL_ORDER.map(key => ({
          key,
          emoji: mealData[key].emoji,
          label: mealData[key].shortName
        })),
        { key: 'summary', emoji: '📋', label: '今日總覽' }
      ];

      document.getElementById('tabNav').innerHTML = tabs.map(t => {
        const isActive = activeTab === t.key;
        return `
          <button onclick="switchTab('${t.key}')" class="flex flex-col sm:flex-row items-center justify-center gap-1 py-2 px-1 rounded-xl text-xs font-bold transition cursor-pointer ${
            isActive
              ? 'bg-[#ffd467] text-[#3d2e08] shadow-xs'
              : 'text-[#735610] hover:bg-white/60'
          }">
            <span class="text-sm sm:text-base">${t.emoji}</span>
            <span>${t.label}</span>
          </button>
        `;
      }).join('');
    }

    function renderMealPage(key, popEffect) {
      const meal = mealData[key];
      const currentIndex = MEAL_ORDER.indexOf(key);
      const nextTab = currentIndex < MEAL_ORDER.length - 1 ? MEAL_ORDER[currentIndex + 1] : 'summary';
      const nextLabel = nextTab === 'summary'
        ? '查看今日完整菜單 📋'
        : `決定好了，前往${mealData[nextTab].shortName} ${mealData[nextTab].emoji}`;

      return `
        <div class="space-y-6">
          <!-- 該餐專屬抽籤主舞台卡片 -->
          <section class="glass-card rounded-3xl overflow-hidden">
            <div class="bg-gradient-to-r from-[#ffd46766] via-[#ffd46738] to-[#fffdf7] px-6 py-5 border-b border-[#ffd46766] flex justify-between items-center">
              <div>
                <span class="inline-block text-xs font-bold text-[#8a6814] bg-white/85 px-2.5 py-0.5 rounded-full mb-1">
                  建議時段 ${meal.time}
                </span>
                <h2 class="text-2xl font-black text-[#3d2e08] flex items-center gap-2">
                  <span>${meal.emoji}</span>
                  <span>${meal.title}</span>
                </h2>
                <p class="text-xs text-[#735610] mt-1">${meal.subtitle}</p>
              </div>
              <span class="text-xs font-bold text-[#8a6814] bg-[#ffd46745] px-3 py-1 rounded-full">
                第 ${currentIndex + 1} / 4 餐
              </span>
            </div>

            <!-- 抽籤結果顯示框 -->
            <div class="p-7 text-center bg-[#fffdf7]">
