<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的一天｜專屬日常與跟練選擇器</title>
  <script src="https://tailwindcss.com"></script>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; }
  </style>
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen">

  <!-- 頂部品牌區 -->
  <header class="bg-white border-b border-stone-200 sticky top-0 z-10">
    <div class="max-w-3xl mx-auto px-5 py-4 flex justify-between items-center">
      <div>
        <span class="text-xs tracking-widest text-rose-500 font-bold uppercase">MY DAY PLANNER</span>
        <h1 class="text-xl font-bold text-stone-900">我的一天｜今日狀態選擇</h1>
      </div>
      <div class="text-right">
        <span id="todayDate" class="text-xs text-stone-500 block"></span>
        <span id="progressBadge" class="text-xs font-bold text-rose-600 bg-rose-50 px-2.5 py-0.5 rounded-full">完成度 0%</span>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-5 py-8 space-y-8">

    <!-- 01 選擇我的一天模式 -->
    <section>
      <h2 class="text-sm font-bold text-stone-500 mb-3">01 選擇今天適合你的節奏</h2>
      <div id="modeButtons" class="grid grid-cols-1 sm:grid-cols-3 gap-3"></div>
    </section>

    <!-- 02 今日推薦時段與清單 -->
    <section class="bg-white rounded-2xl p-6 shadow-sm border border-stone-200">
      <div class="flex flex-wrap justify-between items-start gap-2 border-b border-stone-100 pb-4 mb-5">
        <div>
          <span id="modeTag" class="text-xs font-bold text-rose-600 bg-rose-50 px-2.5 py-1 rounded-md"></span>
          <h3 id="modeTitle" class="text-xl font-bold text-stone-900 mt-2"></h3>
          <p id="modeDesc" class="text-sm text-stone-500 mt-1"></p>
        </div>
        <button onclick="resetToday()" class="text-xs text-stone-400 hover:text-stone-700 underline">重設今日勾選</button>
      </div>

      <!-- 行程列表 -->
      <div id="taskList" class="space-y-3"></div>

      <!-- 自訂新增今日項目 -->
      <div class="mt-6 pt-4 border-t border-stone-100 flex gap-2">
        <input id="customTime" type="text" placeholder="時段（如 20:00）" class="w-28 border border-stone-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-rose-400">
        <input id="customTask" type="text" placeholder="加入你想在今天完成的事..." class="flex-1 border border-stone-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-rose-400">
        <button onclick="addCustomTask()" class="bg-stone-900 hover:bg-stone-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition">新增</button>
      </div>
    </section>

  </main>

  <script>
    const DAY_MODES = {
      busy: {
        name: '忙碌工作日',
        subtitle: '碎片時間 15 分鐘高效啟動',
        tag: '低負擔・高效率',
        desc: '適合行程滿檔的日子，用最短時間維持身體活動與生活節奏。',
        tasks: [
          { id: 'b1', time: '08:00', title: '晨間肩頸伸展 5 分鐘', note: '喚醒身體、改善久坐僵硬', done: false },
          { id: 'b2', time: '12:30', title: '餐後散步 10 分鐘', note: '幫助消化、穩定午後精神', done: false },
          { id: 'b3', time: '19:30', title: '居家核心跟練 10 分鐘', note: '無跳躍動作，下班無壓力完成', done: false },
          { id: 'b4', time: '22:30', title: '睡前腿部放鬆與深呼吸', note: '放下手機，準備進入休息狀態', done: false }
        ]
      },
      active: {
        name: '充實活力日',
        subtitle: '完整訓練與自律生活節奏',
        tag: '進階跟練・狀態滿分',
        desc: '精神與時間充足時，給自己一套完整的運動與專注安排。',
        tasks: [
          { id: 'a1', time: '08:30', title: '溫水補水 ＋ 營養早餐', note: '補充蛋白質與優質碳水', done: false },
          { id: 'a2', time: '10:30', title: '全身燃脂與肌力跟練 25 分鐘', note: '包含熱身、主訓練與收操', done: false },
          { id: 'a3', time: '15:00', title: '下午茶無糖飲品與伸展', note: '遠離螢幕休息 10 分鐘', done: false },
          { id: 'a4', time: '21:00', title: '泡沫軸肌筋膜放鬆 15 分鐘', note: '舒緩肌肉緊繃、提升睡眠品質', done: false }
        ]
      },
      rest: {
        name: '療癒修復日',
        subtitle: '放慢腳步、溫柔照顧身心',
        tag: '低強度・身心充電',
        desc: '生理期、疲憊或週末想徹底放鬆時，以舒緩伸展代替高強度訓練。',
        tasks: [
          { id: 'r1', time: '09:30', title: '自然醒 ＋ 陽台日光伸展', note: '不設鬧鐘壓力，慢慢喚醒身體', done: false },
          { id: 'r2', time: '14:00', title: '全身柔軟度舒緩跟練 15 分鐘', note: '開肩、開髖、釋放背部壓力', done: false },
          { id: 'r3', time: '17:00', title: '散步或享受一杯熱花草茶', note: '留一段純粹屬於自己的空白時間', done: false },
          { id: 'r4', time: '22:00', title: '泡腳或溫熱敷肩頸 10 分鐘', note: '促進循環，早點休息', done: false }
        ]
      }
    };

    let currentMode = localStorage.getItem('myday_mode') || 'busy';
    let savedData = JSON.parse(localStorage.getItem('myday_data')) || DAY_MODES;

    document.getElementById('todayDate').textContent = new Date().toLocaleDateString('zh-TW', {
      year: 'numeric', month: 'long', day: 'numeric', weekday: 'short'
    });

    function saveState() {
      localStorage.setItem('myday_mode', currentMode);
      localStorage.setItem('myday_data', JSON.stringify(savedData));
    }

    function selectMode(modeKey) {
      currentMode = modeKey;
      saveState();
      render();
    }

    function toggleTask(taskId) {
      const list = savedData[currentMode].tasks;
      const item = list.find(t => t.id === taskId);
      if (item) item.done = !item.done;
      saveState();
      render();
    }

    function addCustomTask() {
      const timeVal = document.getElementById('customTime').value.trim() || '彈性時段';
      const titleVal = document.getElementById('customTask').value.trim();
      if (!titleVal) return;
      savedData[currentMode].tasks.push({
        id: 'c_' + Date.now(),
        time: timeVal,
        title: titleVal,
        note: '自訂今日項目',
        done: false
      });
      document.getElementById('customTime').value = '';
      document.getElementById('customTask').value = '';
      saveState();
      render();
    }

    function resetToday() {
      savedData[currentMode].tasks.forEach(t => t.done = false);
      saveState();
      render();
    }

    function render() {
      // 渲染上方模式選擇卡片
      const btnWrap = document.getElementById('modeButtons');
      btnWrap.innerHTML = Object.entries(savedData).map(([key, info]) => {
        const active = key === currentMode;
        return `
          <button onclick="selectMode('${key}')" class="text-left p-4 rounded-xl border transition cursor-pointer ${
            active
              ? 'bg-rose-500 text-white border-rose-500 shadow-sm'
              : 'bg-white text-stone-800 border-stone-200 hover:border-rose-300'
          }">
            <div class="font-bold text-base">${info.name}</div>
            <div class="text-xs mt-1 ${active ? 'text-rose-100' : 'text-stone-500'}">${info.subtitle}</div>
          </button>
        `;
      }).join('');

      // 渲染當前模式的清單
      const modeObj = savedData[currentMode];
      document.getElementById('modeTag').textContent = modeObj.tag;
      document.getElementById('modeTitle').textContent = modeObj.name;
      document.getElementById('modeDesc').textContent = modeObj.desc;

      const doneCount = modeObj.tasks.filter(t => t.done).length;
      const percent = modeObj.tasks.length ? Math.round((doneCount / modeObj.tasks.length) * 100) : 0;
      document.getElementById('progressBadge').textContent = `完成度 ${percent}%`;

      const listWrap = document.getElementById('taskList');
      listWrap.innerHTML = modeObj.tasks.map(task => `
        <label class="flex items-start gap-3 p-3.5 rounded-xl border transition cursor-pointer ${
          task.done ? 'bg-stone-50 border-stone-200 opacity-65' : 'bg-white border-stone-200 hover:border-rose-300'
        }">
          <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleTask('${task.id}')" class="mt-1 w-4 h-4 accent-rose-500 cursor-pointer">
          <div class="flex-1">
            <div class="flex flex-wrap items-center gap-2">
              <span class="text-xs font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded">${task.time}</span>
              <span class="font-bold text-sm ${task.done ? 'line-through text-stone-400' : 'text-stone-900'}">${task.title}</span>
            </div>
            <p class="text-xs text-stone-500 mt-1">${task.note}</p>
          </div>
        </label>
      `).join('');
    }

    render();
  </script>
</body>
</html>
