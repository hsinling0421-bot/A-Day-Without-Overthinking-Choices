<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的一天｜告別選擇障礙</title>
  <script src="https://tailwindcss.com"></script>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #ffd46728;
      color: #4a3b18;
    }
    .brand-card {
      background-color: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      border: 1.5px solid #ffd46766;
    }
    .brand-pill {
      background-color: #ffd46745;
      color: #6b4e09;
    }
    .brand-btn {
      background-color: #ffd467;
      color: #3d2e08;
    }
    .brand-btn:hover {
      background-color: #f7c648;
    }
  </style>
</head>
<body class="min-h-screen pb-14">

  <header class="sticky top-0 z-20 border-b border-[#ffd46766] bg-[#fffdf7]/90 backdrop-blur-md">
    <div class="max-w-3xl mx-auto px-5 py-4 flex flex-wrap justify-between items-center gap-3">
      <div>
        <span class="text-xs font-bold tracking-widest uppercase text-[#a67c14]">MY DAY FOOD PICKER</span>
        <h1 class="text-xl font-bold text-[#3d2e08]">我的一天｜告別選擇障礙</h1>
      </div>
      <button onclick="rollAll()" class="brand-btn font-bold text-sm px-5 py-2.5 rounded-full shadow-sm transition active:scale-95 cursor-pointer">
        ✨ 一鍵幫我決定整天吃什麼
      </button>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-5 pt-6 space-y-6">
    <section class="brand-card rounded-2xl p-5 shadow-sm">
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-bold text-base text-[#3d2e08]">📅 今日餐食決定清單</h2>
        <span class="text-xs text-[#8a6814]">不滿意可點單項「換一個」或直接點下方選項</span>
      </div>
      <div id="summaryGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
    </section>

    <section id="mealsContainer" class="space-y-5"></section>
  </main>

  <script>
    const DEFAULT_MEALS = {
      breakfast: {
        title: '🌅 早餐選擇',
        tag: '開啟活力',
        selected: '總匯三明治 ＋ 無糖鮮奶茶',
        options: [
          '總匯三明治 ＋ 無糖鮮奶茶',
          '起司蛋餅 ＋ 冰美式咖啡',
          '鮪魚玉米吐司 ＋ 無糖豆漿',
          '日式飯糰 ＋ 熱拿鐵',
          '地瓜 ＋ 水煮蛋 ＋ 燕麥奶'
        ]
      },
      lunch: {
        title: '☀️ 午餐選擇',
        tag: '飽足能量',
        selected: '舒肥雞胸健康餐盒',
        options: [
          '舒肥雞胸健康餐盒',
          '日式豚骨拉麵',
          '泰式打拋豬飯 ＋ 荷包蛋',
          '鮮蝦雲吞麵 ＋ 燙青菜',
          '韓式泡菜豆腐鍋',
          '義大利青醬雞肉麵'
        ]
      },
      tea: {
        title: '🧋 下午茶選擇',
        tag: '療癒充電',
        selected: '熟成紅茶微糖少冰 ＋ 白玉珍珠',
        options: [
          '熟成紅茶微糖少冰 ＋ 白玉珍珠',
          '四季春青茶無糖去冰',
          '焦糖布丁 ＋ 熱紅茶',
          '巴斯克乳酪蛋糕 ＋ 美式咖啡',
          '現烤可頌 ＋ 冰拿鐵'
        ]
      },
      dinner: {
        title: '🌙 晚餐選擇',
        tag: '放鬆收尾',
        selected: '昆布小火鍋（多蔬菜少火鍋料）',
        options: [
          '昆布小火鍋（多蔬菜少火鍋料）',
          '炙燒鮭魚丼飯 ＋ 味噌湯',
          '水餃 10 顆 ＋ 酸辣湯',
          '越式生春捲 ＋ 牛肉河粉',
          '滷味拼盤（高麗菜、金針菇、豆腐）'
        ]
      }
    };

    let mealData = JSON.parse(localStorage.getItem('myday_food_v1')) || DEFAULT_MEALS;

    function saveData() {
      localStorage.setItem('myday_food_v1', JSON.stringify(mealData));
    }

    function pickRandom(key) {
      const list = mealData[key].options;
      if (!list.length) return;
      if (list.length === 1) {
        mealData[key].selected = list[0];
      } else {
        let next;
        do {
          next = list[Math.floor(Math.random() * list.length)];
        } while (next === mealData[key].selected);
        mealData[key].selected = next;
      }
      saveData();
      render();
    }

    function rollAll() {
      Object.keys(mealData).forEach(key => pickRandom(key));
    }

    function selectManual(key, item) {
      mealData[key].selected = item;
      saveData();
      render();
    }

    function addOption(key) {
      const input = document.getElementById(`input_${key}`);
      const val = input.value.trim();
      if (!val) return;
      if (!mealData[key].options.includes(val)) {
        mealData[key].options.push(val);
      }
      mealData[key].selected = val;
      input.value = '';
      saveData();
      render();
    }

    function removeOption(key, index, event) {
      event.stopPropagation();
      const removed = mealData[key].options.splice(index, 1)[0];
      if (mealData[key].selected === removed) {
        mealData[key].selected = mealData[key].options[0] || '尚未選擇';
      }
      saveData();
      render();
    }

    function render() {
      const summaryWrap = document.getElementById('summaryGrid');
      summaryWrap.innerHTML = Object.entries(mealData).map(([key, meal]) => `
        <div class="rounded-xl p-3.5 bg-[#ffd46728] border border-[#ffd46788] flex justify-between items-center gap-2">
          <div>
            <span class="text-xs font-bold text-[#8a6814] block">${meal.title}</span>
            <span class="font-bold text-sm text-[#3d2e08] mt-0.5 block">${meal.selected}</span>
          </div>
          <button onclick="pickRandom('${key}')" class="shrink-0 text-xs font-bold px-2.5 py-1.5 rounded-lg bg-white hover:bg-[#ffd467] border border-[#ffd46788] transition cursor-pointer">
            🎲 換一個
          </button>
        </div>
      `).join('');

      const container = document.getElementById('mealsContainer');
      container.innerHTML = Object.entries(mealData).map(([key, meal]) => `
        <div class="brand-card rounded-2xl p-5 shadow-sm">
          <div class="flex justify-between items-center mb-3">
            <div class="flex items-center gap-2">
              <h3 class="font-bold text-lg text-[#3d2e08]">${meal.title}</h3>
              <span class="brand-pill text-xs font-bold px-2.5 py-0.5 rounded-full">${meal.tag}</span>
            </div>
            <button onclick="pickRandom('${key}')" class="brand-btn text-xs font-bold px-3 py-1.5 rounded-lg transition cursor-pointer">
              隨機抽一項
            </button>
          </div>

          <div class="flex flex-wrap gap-2 mb-4">
            ${meal.options.map((opt, idx) => {
              const isSelected = opt === meal.selected;
              return `
                <div onclick="selectManual('${key}', '${opt.replace(/'/g, "\\'")}')" class="group flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm cursor-pointer transition border ${
                  isSelected
                    ? 'bg-[#ffd467] border-[#e0b238] font-bold text-[#3d2e08] shadow-xs'
                    : 'bg-white border-[#ffd46766] text-[#5c491c] hover:bg-[#ffd46728]'
                }">
                  <span>${isSelected ? '✔ ' : ''}${opt}</span>
                  <button onclick="removeOption('${key}', ${idx}, event)" title="刪除此選項" class="text-xs text-[#9c7b28] hover:text-red-600 ml-1 px-1">×</button>
                </div>
              `;
            }).join('')}
          </div>

          <div class="flex gap-2">
            <input id="input_${key}" onkeydown="if(event.key==='Enter') addOption('${key}')" type="text" placeholder="新增想吃的${meal.title.replace(/^[^\s]+\s/, '')}..." class="flex-1 bg-white/90 border border-[#ffd46788] rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-[#d4a324]">
            <button onclick="addOption('${key}')" class="bg-[#5c491c] hover:bg-[#3d2e08] text-white text-xs font-bold px-3.5 py-1.5 rounded-lg transition cursor-pointer">
              ＋ 加入名單
            </button>
          </div>
        </div>
      `).join('');
    }

    render();
  </script>
</body>
</html>
