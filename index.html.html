<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>告別選擇障礙</title>
  <script src="https://tailwindcss.com"></script>
  <link href="https://jsdelivr.net" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'jf-openhuninn';
      src: url('https://jsdelivr.net') format('truetype');
    }
    body {
      font-family: 'jf-openhuninn', 'Noto Sans TC', sans-serif;
      background-color: #ffd46728;
      background-image: radial-gradient(#e5b83b33 2.5px, transparent 2.5px);
      background-size: 32px 32px;
      color: #3b2d14;
      text-align: center;
    }
    .jf-card {
      background: #ffffff;
      border: 2px solid #3b2d14;
      border-radius: 32px;
      box-shadow: 6px 6px 0 #ffd467;
    }
    .jf-btn {
      background: #ffd467;
      color: #3b2d14;
      border: 2px solid #3b2d14;
      box-shadow: 3px 3px 0 #3b2d14;
      transition: transform 0.1s ease;
    }
    .jf-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #3b2d14; }
    .jf-sub {
      background: #fffdf5;
      color: #3b2d14;
      border: 2px solid #3b2d14;
    }
  </style>
</head>
<body class="min-h-screen pb-28">

  <header class="pt-10 pb-6 px-4 max-w-lg mx-auto space-y-3">
    <span class="inline-block text-xs tracking-widest px-4 py-1 rounded-full bg-white border-2 border-[#3b2d14]">
      TODAY'S MENU
    </span>
    <h1 class="text-3xl font-bold tracking-wider">告別選擇障礙</h1>
    <div class="pt-1">
      <button onclick="rollAll()" class="jf-btn text-sm px-6 py-2.5 rounded-full cursor-pointer">
        今日隨機菜單
      </button>
    </div>
  </header>

  <main id="app" class="max-w-lg mx-auto px-4"></main>

  <!-- 右下角圓形懸浮分頁導覽 -->
  <nav id="navTabs" class="fixed bottom-5 right-5 z-30 flex items-center gap-2"></nav>

  <script>
    const ORDER = ['breakfast', 'lunch', 'tea', 'dinner'];
    let data = JSON.parse(localStorage.getItem('food_jf_v1')) || {
      breakfast: { name: '早餐', pick: '總匯三明治＋鮮奶茶', list: ['總匯三明治＋鮮奶茶', '起司蛋餅＋冰美式', '鮪魚吐司＋無糖豆漿', '日式飯糰＋熱拿鐵', '地瓜＋水煮蛋'] },
      lunch:     { name: '午餐', pick: '舒肥雞胸健康餐盒', list: ['舒肥雞胸健康餐盒', '日式豚骨拉麵', '泰式打拋豬飯', '鮮蝦雲吞麵', '韓式泡菜豆腐鍋'] },
      tea:       { name: '下午茶', pick: '熟成紅茶微糖＋珍珠', list: ['熟成紅茶微糖＋珍珠', '四季春無糖去冰', '焦糖布丁＋熱紅茶', '巴斯克蛋糕＋美式', '現烤可頌＋拿鐵'] },
      dinner:    { name: '晚餐', pick: '昆布小火鍋', list: ['昆布小火鍋', '炙燒鮭魚丼飯', '水餃10顆＋酸辣湯', '越式牛肉河粉', '滷味拼盤'] }
    };
    let tab = 'breakfast';

    const save = () => localStorage.setItem('food_jf_v1', JSON.stringify(data));
    const go = (t) => { tab = t; render(); };

    function roll(k) {
      const l = data[k].list;
      if (l.length > 1) {
        let next;
        do { next = l[Math.floor(Math.random() * l.length)]; } while (next === data[k].pick);
        data[k].pick = next;
      }
      save(); render();
    }

    function rollAll() {
      ORDER.forEach(k => { const l = data[k].list; if (l.length) data[k].pick = l[Math.floor(Math.random() * l.length)]; });
      save(); go('summary');
    }

    function choose(i) { data[tab].pick = data[tab].list[i]; save(); render(); }

    function del(i, e) {
      e.stopPropagation();
      const rm = data[tab].list.splice(i, 1);
      if (data[tab].pick === rm) data[tab].pick = data[tab].list || '尚未選擇';
      save(); render();
    }

    function add() {
      const inp = document.getElementById('newInp');
      const v = inp.value.trim();
      if (!v) return;
      if (!data[tab].list.includes(v)) data[tab].list.push(v);
      data[tab].pick = v;
      save(); render();
    }

    function copyAll() {
      const txt = '今日隨機菜單：\n' + ORDER.map(k => `${data[k].name}：${data[k].pick}`).join('\n');
      navigator.clipboard.writeText(txt);
      document.getElementById('cpBtn').textContent = '已複製完成';
    }

    function render() {
      const tabs = [...ORDER.map(k => ({ k, label: data[k].name })), { k: 'summary', label: '總覽' }];
      document.getElementById('navTabs').innerHTML = tabs.map(t =>
        `<button onclick="go('${t.k}')" class="w-13 h-13 w-[52px] h-[52px] rounded-full text-xs cursor-pointer flex items-center justify-center border-2 border-[#3b2d14] transition ${tab === t.k ? 'bg-[#ffd467] shadow-[3px_3px_0_#3b2d14] -translate-y-1' : 'bg-white hover:bg-[#fff6d6]'}">${t.label}</button>`
      ).join('');

      const app = document.getElementById('app');
      if (tab === 'summary') {
        app.innerHTML = `<div class="space-y-4">
          <div class="jf-card p-5 space-y-3">
            <h2 class="text-lg">今日隨機菜單總覽</h2>
            <button id="cpBtn" onclick="copyAll()" class="jf-sub text-xs px-4 py-1.5 rounded-full cursor-pointer">複製整天菜單</button>
          </div>
          ${ORDER.map(k => `
            <div class="jf-card p-5 space-y-2.5">
              <span class="inline-block text-xs px-3 py-0.5 rounded-full bg-[#ffd46745] border border-[#3b2d14]">${data[k].name}</span>
              <p class="text-lg">${data[k].pick}</p>
              <div class="flex justify-center gap-2 pt-1">
                <button onclick="roll('${k}')" class="jf-btn text-xs px-4 py-1.5 rounded-full cursor-pointer">重抽</button>
                <button onclick="go('${k}')" class="jf-sub text-xs px-4 py-1.5 rounded-full cursor-pointer">編輯名單</button>
              </div>
            </div>`).join('')}
        </div>`;
        return;
      }

      const m = data[tab];
      const nextTab = ORDER[ORDER.indexOf(tab) + 1] || 'summary';
      app.innerHTML = `<div class="space-y-5">
        <div class="jf-card p-6 space-y-4">
          <span class="inline-block text-xs px-3.5 py-1 rounded-full bg-[#ffd46755] border border-[#3b2d14]">${m.name}</span>
          <div class="py-5 px-4 rounded-2xl bg-[#ffd46728] border-2 border-dashed border-[#3b2d14] text-xl">${m.pick}</div>
          <div class="flex justify-center gap-3">
            <button onclick="roll('${tab}')" class="jf-btn text-sm px-6 py-2.5 rounded-full cursor-pointer">幫我抽一個</button>
            <button onclick="go('${nextTab}')" class="jf-sub text-sm px-5 py-2.5 rounded-full cursor-pointer">下一餐</button>
          </div>
        </div>
        <div class="jf-card p-5 space-y-3">
          <h3 class="text-sm">我的${m.name}口袋名單</h3>
          <div class="flex flex-wrap justify-center gap-2">
            ${m.list.map((item, i) => `
              <div onclick="choose(${i})" class="px-3.5 py-1.5 rounded-full text-xs border-2 border-[#3b2d14] cursor-pointer flex items-center gap-1.5 ${item === m.pick ? 'bg-[#ffd467]' : 'bg-white hover:bg-[#ffd46728]'}">
                <span>${item}</span>
                <button onclick="del(${i}, event)" class="text-xs ml-1 opacity-60 hover:opacity-100">×</button>
              </div>`).join('')}
          </div>
        </div>
        <div class="jf-card p-4 flex justify-center gap-2">
          <input id="newInp" onkeydown="if(event.key==='Enter')add()" placeholder="新增想吃的${m.name}..." class="flex-1 text-center border-2 border-[#3b2d14] rounded-full px-4 py-2 text-xs bg-white focus:outline-none">
          <button onclick="add()" class="jf-btn text-xs px-5 py-2 rounded-full cursor-pointer">加入</button>
        </div>
      </div>`;
    }
    render();
  </script>
</body>
</html>
