<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>告別選擇障礙</title>
  <meta property="og:title" content="告別選擇障礙" />
  <meta property="og:description" content="今天吃什麼、去哪裡？一鍵幫你決定整天計畫" />
  <meta property="og:type" content="website" />
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Yomogi', 'Zen Maru Gothic', sans-serif; background: #ffd46728 radial-gradient(#e5b83b38 2px, transparent 2px) 0 0 / 28px 28px; color: #3b2d14; text-align: center; min-height: 100vh; padding: 30px 16px 50px; }
    .wrap { max-width: 460px; margin: 0 auto; }
    .tag { display: inline-block; font-size: 11px; letter-spacing: 2px; padding: 4px 16px; background: #fff; border: 2px solid #3b2d14; border-radius: 999px; margin-bottom: 10px; }
    h1 { font-size: 30px; font-weight: 700; letter-spacing: 3px; text-shadow: 0.5px 0 0 #3b2d14; margin-bottom: 14px; }
    .card { background: #fff; border: 2px solid #3b2d14; border-radius: 28px; box-shadow: 5px 5px 0 #ffd467; padding: 20px 18px; margin-bottom: 16px; }
    .pill { display: inline-block; font-size: 15px; font-weight: 700; text-shadow: 0.4px 0 0 #3b2d14; background: #ffd46766; border: 1.5px solid #3b2d14; padding: 4px 18px; border-radius: 999px; margin-bottom: 14px; }
    .pick { background: #ffd46728; border: 2px dashed #3b2d14; border-radius: 20px; padding: 16px 12px; margin-bottom: 16px; }
    .row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
    button { font-family: inherit; cursor: pointer; border: 2px solid #3b2d14; border-radius: 999px; }
    button:active { transform: translate(2px, 2px); }
    .btn-g { background: #ffd467; color: #3b2d14; font-size: 14px; padding: 8px 18px; box-shadow: 3px 3px 0 #3b2d14; }
    .btn-w { background: #fffdf5; color: #3b2d14; font-size: 13px; padding: 8px 15px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; margin-top: 12px; }
    .chip { display: flex; align-items: center; justify-content: space-between; padding: 8px 11px; border: 1.8px solid #3b2d14; border-radius: 999px; font-size: 13px; background: #fff; cursor: pointer; }
    .chip.on { background: #ffd467; }
    .chip span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip b { font-weight: 400; color: #8c6d32; padding-left: 5px; font-size: 14px; }
    .inp-row { display: flex; gap: 8px; margin-top: 12px; }
    input { flex: 1; font-family: inherit; font-size: 13px; text-align: center; padding: 8px 12px; border: 2px solid #3b2d14; border-radius: 999px; outline: none; min-width: 0; }
    .nav { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; margin: 18px 0 20px; }
    .nav button { width: 46px; height: 46px; border-radius: 50%; font-size: 11px; background: #fff; display: flex; align-items: center; justify-content: center; padding: 2px; line-height: 1.1; }
    .nav button.on { background: #ffd467; font-weight: 700; box-shadow: 2px 2px 0 #3b2d14; transform: translateY(-2px); }
    @media (max-width: 380px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header><span class="tag">TODAY'S PLAN</span><h1>告別選擇障礙</h1><button onclick="rollAll()" class="btn-g">今日隨機決定</button><nav id="nav" class="nav"></nav></header>
    <main id="app"></main>
    <p style="font-size:12px;color:#8c6d32;margin-top:20px;">小提示：點選各分頁就能自由新增或刪除自己喜愛的口袋名單喔</p>
  </div>
  <script>
    const INIT = {
      order: ['breakfast', 'lunch', 'tea', 'dinner', 'trip'],
      items: {
        breakfast: { name: '早餐', isMeal: true, shopIdx: 0, dishIdx: 0, shops: [
          { shop: '麥味登', dishes: ['港式蘿蔔糕', '起司牛肉堡', '法式吐司特餐', '培根蛋餅'] },
          { shop: '永和豆漿', dishes: ['招牌飯糰加蛋', '燒餅油條', '鮪魚蛋餅', '小籠湯包'] },
          { shop: '7-11', dishes: ['地瓜＋水煮蛋', '雙拼起司三重奏三明治', '日式鮭魚御飯糰', '紐奧良烤雞三明治'] },
          { shop: '早安美芝城', dishes: ['經典總匯三明治', '卡啦雞腿堡', '起司蛋餅', '招牌蘿蔔糕'] }
        ]},
        lunch: { name: '午餐', isMeal: true, shopIdx: 0, dishIdx: 0, shops: [
          { shop: '摩斯漢堡 MOS', dishes: ['海洋珍珠堡', '蜜汁烤雞起司堡', '薑燒珍珠堡', '摩斯吉士漢堡'] },
          { shop: '梁社漢排骨', dishes: ['炸排骨飯', '椒麻雞飯', '玫瑰油雞飯', '黃金炸雞腿飯'] },
          { shop: '八方雲集', dishes: ['招牌鍋貼＋酸辣湯', '韓式辣味鍋貼', '韭菜水餃＋玉米濃湯', '紹辣乾麵＋抄手'] },
          { shop: '健康水煮餐盒', dishes: ['舒肥嫩雞胸餐盒', '香煎挪威鮭魚餐盒', '蒜泥白肉餐盒', '韓式泡菜里肌餐盒'] }
        ]},
        tea: { name: '下午茶', isMeal: true, shopIdx: 0, dishIdx: 0, shops: [
          { shop: '50 嵐', dishes: ['波霸奶茶', '四季春＋珍波椰', '冰淇淋紅茶', '燕麥紅茶拿鐵'] },
          { shop: '可不可熟成紅茶', dishes: ['熟成紅茶', '白玉歐蕾', '春芽綠茶', '胭脂多多'] },
          { shop: '迷客夏', dishes: ['珍珠紅茶拿鐵', '大甲芋頭鮮奶', '焙茶鮮奶', '青檸香茶'] },
          { shop: '麻古茶坊', dishes: ['楊枝甘露', '芝芝金萱雙Q', '柳橙果粒茶', '高山金萱茶'] },
          { shop: '大茗', dishes: ['酪梨奶蓋紅玉', '烤糖蕎麥凍奶青', '翡翠拿鐵', '蘋果玉露青'] },
          { shop: '得正', dishes: ['焙烏龍奶茶', '輕烏龍鮮奶', '檸檬春烏龍', '芝士奶蓋春烏龍'] }
        ]},
        dinner: { name: '晚餐', isMeal: true, shopIdx: 0, dishIdx: 0, shops: [
          { shop: '三媽臭臭鍋', dishes: ['大腸臭臭鍋', '海鮮豆腐鍋', '泡菜鍋', '沙茶魚頭鍋'] },
          { shop: '麥當勞', dishes: ['大麥克套餐', '勁辣雞腿堡套餐', '麥脆雞腿套餐', '雙層牛肉吉士堡套餐'] },
          { shop: '鐵板燒', dishes: ['黑胡椒牛肉', '蒜香雞腿排', '蔥爆豬肉', '醬燒菲力牛排'] },
          { shop: '夜市小吃', dishes: ['鹽酥雞＋甜不辣', '蚵仔煎＋綜合湯', '大腸包小腸', '藥燉排骨＋滷肉飯'] }
        ]},
        trip: { name: '行程', isMeal: false, pick: '補眠', list: ['補眠', '斷捨離', '按摩', '跑咖', '全聯採購', '逛寶雅', '追劇', '看電影', '運動', '玩遊戲'] }
      }
    };
    let s = JSON.parse(localStorage.getItem('plan_shop4_v5')) || INIT, tab = null;
    const save = () => localStorage.setItem('plan_shop4_v5', JSON.stringify(s)), go = t => { tab = t; render(); };
    const getT = m => !m.shops?.length ? { shop: '尚未新增店家', dish: '請先新增店家' } : { shop: m.shops[m.shopIdx].shop, dish: m.shops[m.shopIdx].dishes[m.dishIdx] || '尚未新增品項' };
    function rollM(k, mode = 'both') {
      const m = s.items[k]; if (!m.shops.length) return;
      if (mode !== 'dish' && m.shops.length > 1) { let n; do { n = Math.floor(Math.random() * m.shops.length); } while (n === m.shopIdx); m.shopIdx = n; }
      const d = m.shops[m.shopIdx].dishes;
      if (d.length > 1) { let i; do { i = Math.floor(Math.random() * d.length); } while (i === m.dishIdx); m.dishIdx = i; } else m.dishIdx = 0;
      save(); render();
    }
    function rollS(k) { const l = s.items[k].list; if (l.length > 1) { let n; do { n = l[Math.floor(Math.random() * l.length)]; } while (n === s.items[k].pick); s.items[k].pick = n; } save(); render(); }
    function rollAll() { s.order.forEach(k => s.items[k].isMeal ? rollM(k) : rollS(k)); go('summary'); }
    function pickSp(i) { s.items[tab].shopIdx = i; s.items[tab].dishIdx = 0; save(); render(); }
    function pickDh(i) { s.items[tab].dishIdx = i; save(); render(); }
    function addSp() { const v = document.getElementById('spInp').value.trim(); if (!v) return; s.items[tab].shops.push({ shop: v, dishes: ['招牌 1', '招牌 2', '招牌 3', '招牌 4'] }); s.items[tab].shopIdx = s.items[tab].shops.length - 1; s.items[tab].dishIdx = 0; save(); render(); }
    function delSp(i, e) { e.stopPropagation(); s.items[tab].shops.splice(i, 1); s.items[tab].shopIdx = 0; s.items[tab].dishIdx = 0; save(); render(); }
    function addDh() { const v = document.getElementById('dhInp').value.trim(), c = s.items[tab].shops[s.items[tab].shopIdx]; if (!v || !c) return; c.dishes.push(v); s.items[tab].dishIdx = c.dishes.length - 1; save(); render(); }
    function delDh(i, e) { e.stopPropagation(); s.items[tab].shops[s.items[tab].shopIdx].dishes.splice(i, 1); s.items[tab].dishIdx = 0; save(); render(); }
    function addCat() { const n = document.getElementById('catInp').value.trim(); if (!n) return; const id = 'c' + Date.now(); s.order.push(id); s.items[id] = { name: n, isMeal: false, pick: '還沒加入選項', list: [] }; save(); go(id); }
    function copy() { navigator.clipboard.writeText('今日隨機決定：\n' + s.order.map(k => s.items[k].isMeal ? `${s.items[k].name}：【${getT(s.items[k]).shop}】${getT(s.items[k]).dish}` : `${s.items[k].name}：${s.items[k].pick}`).join('\n')); document.getElementById('cp').textContent = '已複製完成'; }
    function render() {
      document.getElementById('nav').innerHTML = [...s.order.map(k => ({ k, l: s.items[k].name })), { k: 'summary', l: '總覽' }, { k: 'add', l: '＋' }].map(t => `<button onclick="go('${t.k}')" class="${tab === t.k ? 'on' : ''}">${t.l}</button>`).join('');
      const app = document.getElementById('app');
      if (!tab) { app.innerHTML = ''; return; }
      if (tab === 'add') { app.innerHTML = `<div class="card"><span class="pill">新增類別</span><div class="inp-row"><input id="catInp" onkeydown="if(event.key==='Enter')addCat()" placeholder="例如：宵夜、運動..."><button onclick="addCat()" class="btn-g">新增</button></div></div>`; return; }
      if (tab === 'summary') { app.innerHTML = `<div class="card"><span class="pill">今日隨機決定總覽</span><br><button id="cp" onclick="copy()" class="btn-w" style="font-size:13px;padding:6px 18px;">複製整天清單</button></div>` + s.order.map(k => { const m = s.items[k]; if (!m.isMeal) return `<div class="card"><span class="pill">${m.name}</span><p style="font-size:19px;margin:4px 0 14px;">${m.pick}</p><div class="row"><button onclick="rollS('${k}')" class="btn-g" style="font-size:13px;padding:6px 18px;">重抽</button><button onclick="go('${k}')" class="btn-w" style="font-size:13px;padding:6px 18px;">編輯</button></div></div>`; const t = getT(m); return `<div class="card"><span class="pill">${m.name}</span><p style="font-size:13px;color:#7a5412;">店家：${t.shop}</p><p style="font-size:20px;font-weight:700;margin:4px 0 14px;">${t.dish}</p><div class="row"><button onclick="rollM('${k}')" class="btn-g" style="font-size:13px;padding:6px 16px;">重抽店家</button><button onclick="rollM('${k}','dish')" class="btn-w" style="font-size:13px;padding:6px 14px;">更換餐點</button></div></div>`; }).join(''); return; }
      const m = s.items[tab], next = s.order[s.order.indexOf(tab) + 1] || 'summary';
      if (!m.isMeal) { app.innerHTML = `<div class="card"><span class="pill">${m.name}</span><div class="pick" style="font-size:20px;">${m.pick}</div><div class="row"><button onclick="rollS('${tab}')" class="btn-g">幫我抽一個</button><button onclick="go('${next}')" class="btn-w">${next === 'summary' ? '看總覽' : '下一個'}</button></div></div><div class="card"><p style="font-size:14px;color:#6e5323;">我的${m.name}口袋名單</p><div class="grid">${m.list.map((it, i) => `<div onclick="s.items[tab].pick=s.items[tab].list[${i}];save();render()" class="chip ${it === m.pick ? 'on' : ''}"><span>${it}</span><b onclick="event.stopPropagation();s.items[tab].list.splice(${i},1);save();render()">×</b></div>`).join('')}</div><div class="inp-row"><input id="inp" onkeydown="if(event.key==='Enter'){const v=this.value.trim();if(v){s.items[tab].list.push(v);s.items[tab].pick=v;save();render();}}" placeholder="新增口袋項目..."><button onclick="const v=document.getElementById('inp').value.trim();if(v){s.items[tab].list.push(v);s.items[tab].pick=v;save();render();}" class="btn-g" style="padding:7px 16px;font-size:13px;">新增</button></div></div>`; return; }
      const t = getT(m), cur = m.shops[m.shopIdx] || { dishes: [] }, nextLabel = (s.items[next] && s.items[next].isMeal) ? '下一餐' : '下一個';
      app.innerHTML = `<div class="card"><span class="pill">${m.name}</span><div class="pick"><div style="font-size:14px;font-weight:700;color:#7a5412;margin-bottom:6px;">店家：${t.shop}</div><div style="font-size:21px;font-weight:700;">${t.dish}</div></div><div class="row"><button onclick="rollM('${tab}')" class="btn-g">重抽店家</button><button onclick="rollM('${tab}','dish')" class="btn-w">更換餐點</button><button onclick="go('${next}')" class="btn-w">${nextLabel}</button></div></div><div class="card"><p style="font-size:14px;color:#6e5323;">要吃哪一間？</p><div class="grid">${m.shops.map((sp, i) => `<div onclick="pickSp(${i})" class="chip ${i === m.shopIdx ? 'on' : ''}"><span>${sp.shop}</span><b onclick="delSp(${i},event)">×</b></div>`).join('')}</div><div class="inp-row"><input id="spInp" onkeydown="if(event.key==='Enter')addSp()" placeholder="新增口袋店家..."><button onclick="addSp()" class="btn-g" style="padding:7px 16px;font-size:13px;">新增</button></div></div><div class="card"><p style="font-size:14px;color:#6e5323;">要吃什麼呢？</p><div class="grid">${cur.dishes.map((d, i) => `<div onclick="pickDh(${i})" class="chip ${i === m.dishIdx ? 'on' : ''}"><span>${d}</span><b onclick="delDh(${i},event)">×</b></div>`).join('')}</div><div class="inp-row"><input id="dhInp" onkeydown="if(event.key==='Enter')addDh()" placeholder="新增口袋品項..."><button onclick="addDh()" class="btn-g" style="padding:7px 16px;font-size:13px;">新增</button></div></div>`;
    }
    render();
  </script>
</body>
</html>
